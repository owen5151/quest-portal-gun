<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Season 1 C-137 Portal Gun</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    )
);


/* =====================================================
   VR
===================================================== */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);
document.body.appendChild(
    VRButton.createButton(renderer)
);


/* =====================================================
   FLOOR
===================================================== */

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    new THREE.MeshStandardMaterial({
        color: 0x555555
    })
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);


/* =====================================================
   TEST CUBE
===================================================== */

const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({
        color: 0x00ff88
    })
);

cube.position.set(0, 0.5, -3);
scene.add(cube);


/* =====================================================
   CONTROLLERS
===================================================== */

const controller0 =
    renderer.xr.getController(0);

const controller1 =
    renderer.xr.getController(1);

scene.add(controller0);
scene.add(controller1);


/* =====================================================
   LASERS
===================================================== */

function addLaser(controller) {

    const geometry =
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
        ]);

    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });

    const laser =
        new THREE.Line(
            geometry,
            material
        );

    laser.scale.z = 5;

    controller.add(laser);
}

addLaser(controller0);
addLaser(controller1);


/* =====================================================
   PORTAL GUN
===================================================== */

const gun = new THREE.Group();


/* =====================================================
   MAIN THIN BODY
===================================================== */

const body = new THREE.Mesh(
    new THREE.BoxGeometry(
        0.105,
        0.075,
        0.38
    ),
    new THREE.MeshStandardMaterial({
        color: 0xd6d2c4,
        roughness: 0.75
    })
);

gun.add(body);


/* =====================================================
   FRONT NOSE
===================================================== */

const nose = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.052,
        0.065,
        0.11,
        16
    ),
    new THREE.MeshStandardMaterial({
        color: 0xbdb9ad,
        roughness: 0.7
    })
);

nose.rotation.x = Math.PI / 2;

nose.position.z = -0.245;

gun.add(nose);


/* =====================================================
   DARK FRONT OPENING
===================================================== */

const opening = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.035,
        0.035,
        0.012,
        16
    ),
    new THREE.MeshStandardMaterial({
        color: 0x171717
    })
);

opening.rotation.x = Math.PI / 2;

opening.position.z = -0.302;

gun.add(opening);


/* =====================================================
   SMALL GREEN EMITTER
===================================================== */

const emitterGlow = new THREE.Mesh(
    new THREE.SphereGeometry(
        0.018,
        12,
        12
    ),
    new THREE.MeshStandardMaterial({
        color: 0x39ff55,
        emissive: 0x12ff30,
        emissiveIntensity: 3
    })
);

emitterGlow.position.z = -0.31;

gun.add(emitterGlow);


/* =====================================================
   LONG TOP VIAL
===================================================== */

/*
   The vial is LONG and narrow.
*/

const vial = new THREE.Group();

vial.position.set(
    0,
    0.075,
    0.015
);

vial.rotation.z = Math.PI / 2;

gun.add(vial);


/* Glass tube */

const glass = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.035,
        0.035,
        0.24,
        20
    ),
    new THREE.MeshPhysicalMaterial({
        color: 0xbaffc7,
        transparent: true,
        opacity: 0.28,
        roughness: 0.05,
        transmission: 0.1,
        depthWrite: false
    })
);

vial.add(glass);


/* =====================================================
   GREEN ENERGY INSIDE VIAL
===================================================== */

const energy = new THREE.Mesh(
    new THREE.SphereGeometry(
        0.028,
        16,
        12
    ),
    new THREE.MeshStandardMaterial({
        color: 0x35ff4f,
        emissive: 0x0cff25,
        emissiveIntensity: 3
    })
);

energy.position.set(
    0,
    0,
    0
);

vial.add(energy);


/* Energy core */

const energyCore = new THREE.Mesh(
    new THREE.SphereGeometry(
        0.014,
        12,
        12
    ),
    new THREE.MeshBasicMaterial({
        color: 0xcaffd0
    })
);

vial.add(energyCore);


/* =====================================================
   VIAL CAPS
===================================================== */

const capMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x77756d,
        metalness: 0.5,
        roughness: 0.45
    });


const capFront = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.043,
        0.043,
        0.025,
        16
    ),
    capMaterial
);

capFront.position.x = -0.13;

vial.add(capFront);


const capBack = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.043,
        0.043,
        0.025,
        16
    ),
    capMaterial
);

capBack.position.x = 0.13;

vial.add(capBack);


/* =====================================================
   SIDE CONTROL PANEL
===================================================== */

const sidePanel = new THREE.Mesh(
    new THREE.BoxGeometry(
        0.018,
        0.045,
        0.17
    ),
    new THREE.MeshStandardMaterial({
        color: 0x44433f,
        metalness: 0.3
    })
);

sidePanel.position.set(
    0.062,
    0.005,
    0.015
);

gun.add(sidePanel);


/* =====================================================
   BLACK DIAL
===================================================== */

const dial = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.026,
        0.026,
        0.018,
        20
    ),
    new THREE.MeshStandardMaterial({
        color: 0x111111,
        roughness: 0.45
    })
);

dial.rotation.x = Math.PI / 2;

dial.position.set(
    0.06,
    0.025,
    -0.09
);

gun.add(dial);


/* Dial center */

const dialCenter = new THREE.Mesh(
    new THREE.SphereGeometry(
        0.009,
        10,
        10
    ),
    new THREE.MeshStandardMaterial({
        color: 0x777777
    })
);

dialCenter.position.set(
    0.06,
    0.025,
    -0.102
);

gun.add(dialCenter);


/* =====================================================
   RED DISPLAY
===================================================== */

const display = new THREE.Mesh(
    new THREE.BoxGeometry(
        0.06,
        0.028,
        0.008
    ),
    new THREE.MeshStandardMaterial({
        color: 0x4d0909,
        emissive: 0x330000,
        emissiveIntensity: 1.5
    })
);

display.position.set(
    -0.01,
    0.035,
    -0.13
);

gun.add(display);


/* =====================================================
   DISPLAY TEXT
===================================================== */

const canvas =
    document.createElement("canvas");

canvas.width = 256;
canvas.height = 128;

const ctx =
    canvas.getContext("2d");

ctx.fillStyle = "#250000";
ctx.fillRect(
    0,
    0,
    256,
    128
);

ctx.fillStyle = "#ff3333";

ctx.font =
    "bold 62px Arial";

ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
    "C-137",
    128,
    64
);

const displayTexture =
    new THREE.CanvasTexture(canvas);

const displayText = new THREE.Mesh(
    new THREE.PlaneGeometry(
        0.052,
        0.026
    ),
    new THREE.MeshBasicMaterial({
        map: displayTexture,
        transparent: true
    })
);

displayText.position.set(
    -0.01,
    0.035,
    -0.136
);

gun.add(displayText);


/* =====================================================
   SIDE-MOUNTED HANDLE
===================================================== */

/*
   The handle comes out from the SIDE/BOTTOM
   and angles DOWN toward the user.
*/

const handle = new THREE.Group();

handle.position.set(
    -0.035,
    -0.035,
    0.055
);

handle.rotation.z =
    THREE.MathUtils.degToRad(-22);

gun.add(handle);


/* Handle body */

const handleBody = new THREE.Mesh(
    new THREE.BoxGeometry(
        0.085,
        0.20,
        0.10
    ),
    new THREE.MeshStandardMaterial({
        color: 0x77766f,
        roughness: 0.8
    })
);

handleBody.position.y = -0.095;

handleBody.rotation.x =
    THREE.MathUtils.degToRad(-8);

handle.add(handleBody);


/* Dark grip */

const grip = new THREE.Mesh(
    new THREE.BoxGeometry(
        0.075,
        0.13,
        0.085
    ),
    new THREE.MeshStandardMaterial({
        color: 0x383734,
        roughness: 0.8
    })
);

grip.position.y = -0.17;

handle.add(grip);


/* =====================================================
   HANDLE END
===================================================== */

const handleEnd = new THREE.Mesh(
    new THREE.SphereGeometry(
        0.043,
        12,
        10
    ),
    new THREE.MeshStandardMaterial({
        color: 0x292929
    })
);

handleEnd.position.y = -0.235;

handle.add(handleEnd);


/* =====================================================
   SMALL MECHANICAL BLOCKS
===================================================== */

const mechMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x55534d,
        metalness: 0.45,
        roughness: 0.5
    });


const mech1 = new THREE.Mesh(
    new THREE.BoxGeometry(
        0.025,
        0.035,
        0.055
    ),
    mechMaterial
);

mech1.position.set(
    -0.065,
    0.005,
    0.08
);

gun.add(mech1);


const mech2 = new THREE.Mesh(
    new THREE.BoxGeometry(
        0.022,
        0.025,
        0.075
    ),
    mechMaterial
);

mech2.position.set(
    0.063,
    -0.025,
    0.105
);

gun.add(mech2);


/* =====================================================
   RIGHT CONTROLLER
===================================================== */

controller1.add(gun);


/* =====================================================
   GUN SIZE
===================================================== */

gun.scale.set(
    0.55,
    0.55,
    0.55
);


/* =====================================================
   GUN POSITION
===================================================== */

gun.position.set(
    0,
    -0.025,
    -0.07
);


/* =====================================================
   GUN ROTATION
===================================================== */

gun.rotation.set(
    0,
    0,
    0
);


/* =====================================================
   BOTH CONTROLLERS — DO NOT CHANGE
===================================================== */

controller0.addEventListener(
    "selectstart",
    () => {

        cube.material.color.set(
            0xff0000
        );

    }
);

controller1.addEventListener(
    "selectstart",
    () => {

        cube.material.color.set(
            0xff0000
        );

    }
);

controller0.addEventListener(
    "selectend",
    () => {

        cube.material.color.set(
            0x00ff88
        );

    }
);

controller1.addEventListener(
    "selectend",
    () => {

        cube.material.color.set(
            0x00ff88
        );

    }
);


/* =====================================================
   ANIMATION
===================================================== */

let time = 0;

renderer.setAnimationLoop(() => {

    time += 0.03;


    /* Green energy gently pulses */

    const pulse =
        1 +
        Math.sin(time * 4) * 0.12;

    energy.scale.set(
        pulse,
        pulse,
        pulse
    );

    energy.rotation.y += 0.025;


    /* Energy core */

    energyCore.scale.set(
        1 + Math.sin(time * 5) * 0.15,
        1 + Math.sin(time * 5) * 0.15,
        1 + Math.sin(time * 5) * 0.15
    );


    renderer.render(
        scene,
        camera
    );

});

</script>

</body>
</html>
