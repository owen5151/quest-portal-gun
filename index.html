<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C-137 Portal Gun</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x202020);


const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );


/* =====================================================
   LIGHT
===================================================== */

const light =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(light);


/* =====================================================
   VR
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);

document.body.appendChild(
    VRButton.createButton(renderer)
);


/* =====================================================
   FLOOR
===================================================== */

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({
            color: 0x555555
        })
    );

floor.rotation.x =
    -Math.PI / 2;

scene.add(floor);


/* =====================================================
   TEST CUBE
===================================================== */

const cube =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1,
            1,
            1
        ),
        new THREE.MeshStandardMaterial({
            color: 0x00ff88
        })
    );

cube.position.set(
    0,
    0.5,
    -3
);

scene.add(cube);


/* =====================================================
   CONTROLLERS
===================================================== */

const controller0 =
    renderer.xr.getController(0);

const controller1 =
    renderer.xr.getController(1);

scene.add(controller0);
scene.add(controller1);


/* =====================================================
   CONTROLLER LASERS
===================================================== */

function addLaser(controller) {

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);

    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });

    const laser =
        new THREE.Line(
            geometry,
            material
        );

    laser.scale.z = 5;

    controller.add(laser);
}

addLaser(controller0);
addLaser(controller1);


/* =====================================================
   PORTAL GUN
===================================================== */

const gun =
    new THREE.Group();


/* =====================================================
   MAIN BODY
===================================================== */

const bodyShape =
    new THREE.Shape();

bodyShape.moveTo(-0.09, 0.00);
bodyShape.lineTo(-0.07, 0.075);
bodyShape.lineTo(0.085, 0.075);
bodyShape.lineTo(0.10, 0.045);
bodyShape.lineTo(0.095, -0.015);
bodyShape.lineTo(0.055, -0.045);
bodyShape.lineTo(-0.02, -0.045);
bodyShape.lineTo(-0.065, -0.015);
bodyShape.closePath();


const bodyGeometry =
    new THREE.ExtrudeGeometry(
        bodyShape,
        {
            depth: 0.30,
            bevelEnabled: true,
            bevelSegments: 2,
            bevelSize: 0.008,
            bevelThickness: 0.008
        }
    );

bodyGeometry.center();


const body =
    new THREE.Mesh(
        bodyGeometry,
        new THREE.MeshStandardMaterial({
            color: 0xd7d7cf,
            roughness: 0.7,
            metalness: 0.15
        })
    );

gun.add(body);


/* =====================================================
   HANDLE
===================================================== */

const handleShape =
    new THREE.Shape();

handleShape.moveTo(-0.035, 0.01);
handleShape.lineTo(0.035, 0.00);
handleShape.lineTo(0.025, -0.08);
handleShape.lineTo(0.01, -0.17);
handleShape.lineTo(-0.015, -0.205);
handleShape.lineTo(-0.045, -0.19);
handleShape.lineTo(-0.055, -0.15);
handleShape.lineTo(-0.04, -0.08);
handleShape.closePath();


const handleGeometry =
    new THREE.ExtrudeGeometry(
        handleShape,
        {
            depth: 0.105,
            bevelEnabled: true,
            bevelSegments: 2,
            bevelSize: 0.01,
            bevelThickness: 0.008
        }
    );

handleGeometry.center();


const handle =
    new THREE.Mesh(
        handleGeometry,
        new THREE.MeshStandardMaterial({
            color: 0x8b8b83,
            roughness: 0.75,
            metalness: 0.1
        })
    );

handle.position.set(
    -0.005,
    -0.09,
    0
);

gun.add(handle);


/* =====================================================
   BLACK CONTROL DIAL
===================================================== */

const dial =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.032,
            0.032,
            0.018,
            20
        ),
        new THREE.MeshStandardMaterial({
            color: 0x171717,
            roughness: 0.5
        })
    );

dial.rotation.x =
    Math.PI / 2;

dial.position.set(
    -0.055,
    0.035,
    -0.17
);

gun.add(dial);


/* =====================================================
   RED C-137 DISPLAY
===================================================== */

const display =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.075,
            0.035,
            0.008
        ),
        new THREE.MeshStandardMaterial({
            color: 0x5c1010,
            emissive: 0x330000,
            emissiveIntensity: 1
        })
    );

display.position.set(
    0.025,
    0.038,
    -0.17
);

gun.add(display);


/* =====================================================
   C-137 TEXT
===================================================== */

const canvas =
    document.createElement("canvas");

canvas.width = 256;
canvas.height = 128;

const ctx =
    canvas.getContext("2d");

ctx.fillStyle = "#220000";
ctx.fillRect(
    0,
    0,
    256,
    128
);

ctx.fillStyle = "#ff4444";

ctx.font =
    "bold 70px Arial";

ctx.textAlign =
    "center";

ctx.textBaseline =
    "middle";

ctx.fillText(
    "C-137",
    128,
    64
);


const textTexture =
    new THREE.CanvasTexture(canvas);


const textMesh =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            0.065,
            0.032
        ),
        new THREE.MeshBasicMaterial({
            map: textTexture,
            transparent: true
        })
    );

textMesh.position.set(
    0.025,
    0.038,
    -0.176
);

gun.add(textMesh);


/* =====================================================
   FLUID RESERVOIR BASE
===================================================== */

const reservoirBase =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.052,
            0.058,
            0.025,
            24
        ),
        new THREE.MeshStandardMaterial({
            color: 0xbcbcb4,
            metalness: 0.4,
            roughness: 0.5
        })
    );

reservoirBase.position.set(
    0.035,
    0.11,
    0
);

gun.add(reservoirBase);


/* =====================================================
   GLASS DOME
===================================================== */

const glass =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.065,
            20,
            16,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        ),
        new THREE.MeshPhysicalMaterial({
            color: 0x99ffcc,
            transparent: true,
            opacity: 0.28,
            roughness: 0.05,
            transmission: 0.2,
            depthWrite: false
        })
    );

glass.position.set(
    0.035,
    0.125,
    0
);

gun.add(glass);


/* =====================================================
   GREEN PORTAL FLUID
===================================================== */

const fluid =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.053,
            16,
            12
        ),
        new THREE.MeshStandardMaterial({
            color: 0x39ff52,
            emissive: 0x0aff22,
            emissiveIntensity: 2.5,
            transparent: true,
            opacity: 0.88
        })
    );

fluid.position.set(
    0.035,
    0.13,
    0
);

fluid.scale.y =
    0.75;

gun.add(fluid);


/* =====================================================
   FLUID BUBBLES
===================================================== */

const bubbles = [];

for (let i = 0; i < 6; i++) {

    const bubble =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.006 + Math.random() * 0.005,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color: 0xbaffc0,
                transparent: true,
                opacity: 0.8
            })
        );

    bubble.position.set(
        0.035 +
        (Math.random() - 0.5) * 0.065,

        0.105 +
        Math.random() * 0.06,

        (Math.random() - 0.5) * 0.045
    );

    gun.add(bubble);

    bubbles.push(bubble);
}


/* =====================================================
   ATTACH GUN TO RIGHT CONTROLLER
===================================================== */

controller1.add(gun);


/* =====================================================
   SIZE
===================================================== */

gun.scale.set(
    0.62,
    0.62,
    0.62
);


/* =====================================================
   POSITION
===================================================== */

gun.position.set(
    0,
    -0.025,
    -0.08
);


/* =====================================================
   ROTATION
===================================================== */

gun.rotation.set(
    0,
    0,
    0
);


/* =====================================================
   TRIGGERS
===================================================== */

controller0.addEventListener(
    "selectstart",
    () => {

        cube.material.color.set(
            0xff0000
        );

    }
);

controller1.addEventListener(
    "selectstart",
    () => {

        cube.material.color.set(
            0xff0000
        );

    }
);

controller0.addEventListener(
    "selectend",
    () => {

        cube.material.color.set(
            0x00ff88
        );

    }
);

controller1.addEventListener(
    "selectend",
    () => {

        cube.material.color.set(
            0x00ff88
        );

    }
);


/* =====================================================
   ANIMATION
===================================================== */

let time = 0;

renderer.setAnimationLoop(
    () => {

        time += 0.03;


        /* Animate portal fluid */

        fluid.scale.y =
            0.75 +
            Math.sin(time * 2) * 0.05;


        fluid.rotation.y += 0.01;


        /* Animate bubbles */

        for (
            let i = 0;
            i < bubbles.length;
            i++
        ) {

            bubbles[i].position.y +=
                0.0008;

            if (
                bubbles[i].position.y >
                0.175
            ) {

                bubbles[i].position.y =
                    0.105;

            }
        }


        renderer.render(
            scene,
            camera
        );

    }
);

</script>

</body>
</html>
