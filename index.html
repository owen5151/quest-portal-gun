<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quest Controller Test</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x202020);


const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );


const light =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(light);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);

document.body.appendChild(
    VRButton.createButton(renderer)
);


/* FLOOR */

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({
            color: 0x555555
        })
    );

floor.rotation.x = -Math.PI / 2;

scene.add(floor);


/* CUBE */

const cube =
    new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
            color: 0x00ff88
        })
    );

cube.position.set(
    0,
    0.5,
    -3
);

scene.add(cube);


/* CONTROLLERS */

const controller0 =
    renderer.xr.getController(0);

const controller1 =
    renderer.xr.getController(1);

scene.add(controller0);
scene.add(controller1);


/* LASERS */

function addLaser(controller) {

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);

    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });

    const laser =
        new THREE.Line(
            geometry,
            material
        );

    laser.scale.z = 5;

    controller.add(laser);
}

addLaser(controller0);
addLaser(controller1);


/*
    TEMPORARY TEST

    Either controller trigger
    should change the cube.
*/

controller0.addEventListener(
    "selectstart",
    () => {
        cube.material.color.set(0xff0000);
    }
);

controller1.addEventListener(
    "selectstart",
    () => {
        cube.material.color.set(0xff0000);
    }
);

controller0.addEventListener(
    "selectend",
    () => {
        cube.material.color.set(0x00ff88);
    }
);

controller1.addEventListener(
    "selectend",
    () => {
        cube.material.color.set(0x00ff88);
    }
);


/* RENDER */

renderer.setAnimationLoop(
    () => {
        renderer.render(
            scene,
            camera
        );
    }
);

</script>

</body>
</html>
