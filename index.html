<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rick Style Portal Gun</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x202020);


const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);


/* =========================
   LIGHT
========================= */

const light =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(light);


/* =========================
   VR
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);

document.body.appendChild(
    VRButton.createButton(renderer)
);


/* =========================
   FLOOR
========================= */

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({
            color: 0x555555
        })
    );

floor.rotation.x =
    -Math.PI / 2;

scene.add(floor);


/* =========================
   TEST CUBE
========================= */

const cube =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1,
            1,
            1
        ),
        new THREE.MeshStandardMaterial({
            color: 0x00ff88
        })
    );

cube.position.set(
    0,
    0.5,
    -3
);

scene.add(cube);


/* =========================
   CONTROLLERS
========================= */

const controller0 =
    renderer.xr.getController(0);

const controller1 =
    renderer.xr.getController(1);

scene.add(controller0);
scene.add(controller1);


/* =========================
   LASERS
========================= */

function addLaser(controller) {

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);

    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });

    const laser =
        new THREE.Line(
            geometry,
            material
        );

    laser.scale.z = 5;

    controller.add(laser);
}

addLaser(controller0);
addLaser(controller1);


/* ==================================================
   RICK-STYLE PORTAL GUN
================================================== */

const gun =
    new THREE.Group();


/* =========================
   MAIN BODY
========================= */

const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.11,
            0.13,
            0.34
        ),
        new THREE.MeshStandardMaterial({
            color: 0xd8d2bd,
            roughness: 0.8
        })
    );

gun.add(body);


/* =========================
   TOP REAR HOUSING
========================= */

const topHousing =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.13,
            0.07,
            0.18
        ),
        new THREE.MeshStandardMaterial({
            color: 0xaaa48f
        })
    );

topHousing.position.set(
    0,
    0.09,
    0.04
);

gun.add(topHousing);


/* =========================
   FRONT EMITTER
========================= */

const emitter =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.075,
            0.095,
            0.18,
            16
        ),
        new THREE.MeshStandardMaterial({
            color: 0xbcb6a4
        })
    );

emitter.rotation.x =
    Math.PI / 2;

emitter.position.z =
    -0.25;

gun.add(emitter);


/* =========================
   DARK INNER BARREL
========================= */

const innerBarrel =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.042,
            0.042,
            0.19,
            16
        ),
        new THREE.MeshStandardMaterial({
            color: 0x292929
        })
    );

innerBarrel.rotation.x =
    Math.PI / 2;

innerBarrel.position.z =
    -0.26;

gun.add(innerBarrel);


/* =========================
   ENERGY RING
========================= */

const energyRing =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            0.058,
            0.012,
            8,
            20
        ),
        new THREE.MeshStandardMaterial({
            color: 0x00aaff,
            emissive: 0x0088ff,
            emissiveIntensity: 3
        })
    );

energyRing.rotation.x =
    Math.PI / 2;

energyRing.position.z =
    -0.355;

gun.add(energyRing);


/* =========================
   GRIP
========================= */

const grip =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.095,
            0.23,
            0.105
        ),
        new THREE.MeshStandardMaterial({
            color: 0x3b342c
        })
    );

grip.position.set(
    0,
    -0.16,
    0.035
);

grip.rotation.x =
    -0.15;

gun.add(grip);


/* =========================
   GRIP END
========================= */

const gripBottom =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.055,
            12,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x292929
        })
    );

gripBottom.position.set(
    0,
    -0.28,
    0.01
);

gun.add(gripBottom);


/* =========================
   SIDE MECHANICAL PART
========================= */

const sidePart =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.025,
            0.07,
            0.16
        ),
        new THREE.MeshStandardMaterial({
            color: 0x383838
        })
    );

sidePart.position.set(
    0.065,
    0.01,
    -0.02
);

gun.add(sidePart);


/* =========================
   ORANGE ENERGY LIGHT
========================= */

const orangeLight =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.025,
            10,
            10
        ),
        new THREE.MeshStandardMaterial({
            color: 0xff6600,
            emissive: 0xff3300,
            emissiveIntensity: 3
        })
    );

orangeLight.position.set(
    0,
    0.025,
    -0.17
);

gun.add(orangeLight);


/* =========================
   SMALL TOP BUTTON
========================= */

const button =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.018,
            0.018,
            0.025,
            10
        ),
        new THREE.MeshStandardMaterial({
            color: 0x777777
        })
    );

button.rotation.z =
    Math.PI / 2;

button.position.set(
    0,
    0.125,
    0.02
);

gun.add(button);


/* ==================================================
   ATTACH TO RIGHT CONTROLLER
================================================== */

controller1.add(gun);


/* =========================
   GUN POSITION
========================= */

gun.position.set(
    0,
    -0.015,
    -0.075
);


/* =========================
   GUN ROTATION
========================= */

gun.rotation.set(
    0,
    0,
    0
);


/* =========================
   GUN SIZE
========================= */

gun.scale.set(
    0.72,
    0.72,
    0.72
);


/* ==================================================
   BOTH CONTROLLERS
================================================== */

controller0.addEventListener(
    "selectstart",
    () => {

        cube.material.color.set(
            0xff0000
        );

    }
);


controller1.addEventListener(
    "selectstart",
    () => {

        cube.material.color.set(
            0xff0000
        );

    }
);


controller0.addEventListener(
    "selectend",
    () => {

        cube.material.color.set(
            0x00ff88
        );

    }
);


controller1.addEventListener(
    "selectend",
    () => {

        cube.material.color.set(
            0x00ff88
        );

    }
);


/* =========================
   RENDER LOOP
========================= */

renderer.setAnimationLoop(
    () => {

        renderer.render(
            scene,
            camera
        );

    }
);

</script>

</body>
</html>
