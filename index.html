<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quest Portal Gun</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x202020);


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.01,
        100
    );


/* =========================
   LIGHT
========================= */

const light =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(light);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =========================
   VR BUTTON
========================= */

document.body.appendChild(
    VRButton.createButton(renderer)
);


/* =========================
   FLOOR
========================= */

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            10,
            10
        ),

        new THREE.MeshStandardMaterial({
            color: 0x555555
        })

    );

floor.rotation.x =
    -Math.PI / 2;

scene.add(floor);


/* =========================
   CUBE
========================= */

const cube =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            1,
            1
        ),

        new THREE.MeshStandardMaterial({
            color: 0x00ff88
        })

    );

cube.position.set(
    0,
    0.5,
    -3
);

scene.add(cube);


/* =========================
   CONTROLLERS
========================= */

const controller0 =
    renderer.xr.getController(0);

const controller1 =
    renderer.xr.getController(1);

scene.add(controller0);
scene.add(controller1);


/* =========================
   CONTROLLER RAYS
========================= */

function makeRay() {

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints([

                new THREE.Vector3(
                    0, 0, 0
                ),

                new THREE.Vector3(
                    0, 0, -1
                )

            ]);

    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });

    const ray =
        new THREE.Line(
            geometry,
            material
        );

    ray.scale.z = 5;

    return ray;
}


controller0.add(
    makeRay()
);

controller1.add(
    makeRay()
);


/* =========================
   FIND RIGHT / LEFT HAND
========================= */

let rightController = null;
let leftController = null;


function identifyControllers() {

    const session =
        renderer.xr.getSession();

    if (!session) return;


    for (
        const source
        of session.inputSources
    ) {

        if (
            source.handedness === "right"
        ) {

            rightController =
                source.targetRayMode === "tracked-pointer"
                ? (
                    source.gamepad
                    ? getControllerForSource(source)
                    : rightController
                )
                : rightController;
        }


        if (
            source.handedness === "left"
        ) {

            leftController =
                source.targetRayMode === "tracked-pointer"
                ? (
                    source.gamepad
                    ? getControllerForSource(source)
                    : leftController
                )
                : leftController;
        }
    }
}


/* =========================
   MATCH INPUT SOURCE
========================= */

function getControllerForSource(source) {

    /*
       Three.js controller objects contain
       the XR input source that created them.
    */

    if (
        controller0.userData.inputSource === source
    ) {

        return controller0;

    }


    if (
        controller1.userData.inputSource === source
    ) {

        return controller1;

    }


    return null;
}


/* =========================
   SELECT EVENTS
========================= */

function rightTriggerPressed() {

    cube.material.color.set(
        0xff0000
    );

}


function rightTriggerReleased() {

    cube.material.color.set(
        0x00ff88
    );

}


/*
   We'll attach the event to BOTH
   controllers temporarily.

   The handler checks which one
   is actually the right hand.
*/

function handleSelectStart(event) {

    if (
        event.target === rightController
    ) {

        rightTriggerPressed();

    }

}


function handleSelectEnd(event) {

    if (
        event.target === rightController
    ) {

        rightTriggerReleased();

    }

}


controller0.addEventListener(
    "selectstart",
    handleSelectStart
);

controller1.addEventListener(
    "selectstart",
    handleSelectStart
);

controller0.addEventListener(
    "selectend",
    handleSelectEnd
);

controller1.addEventListener(
    "selectend",
    handleSelectEnd
);


/* =========================
   XR SESSION START
========================= */

renderer.xr.addEventListener(
    "sessionstart",
    () => {

        /*
           Find which Three.js controller
           corresponds to each hand.
        */

        const session =
            renderer.xr.getSession();

        for (
            const source
            of session.inputSources
        ) {

            if (
                source.handedness === "right"
            ) {

                if (
                    controller0.userData.inputSource === source
                ) {

                    rightController =
                        controller0;

                }
                else if (
                    controller1.userData.inputSource === source
                ) {

                    rightController =
                        controller1;

                }

            }


            if (
                source.handedness === "left"
            ) {

                if (
                    controller0.userData.inputSource === source
                ) {

                    leftController =
                        controller0;

                }
                else if (
                    controller1.userData.inputSource === source
                ) {

                    leftController =
                        controller1;

                }

            }

        }

    }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================
   RENDER
========================= */

renderer.setAnimationLoop(
    () => {

        renderer.render(
            scene,
            camera
        );

    }
);

</script>

</body>
</html>
